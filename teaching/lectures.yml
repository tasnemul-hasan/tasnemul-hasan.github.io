# Canonical source for the Teaching section.
# Edit this file, then run:  python teaching/build_lectures.py
# The script regenerates teaching/lectures/*.qmd and checks the data.
#
# slides-id : the Google Drive file ID from the presentation URL. Do not alter it.
# filters   : sysid | nn | fuzzy | anfis | apps  (used by the filter buttons on teaching/index.qmd)

lectures:
  - number: 1
    id: SysID_Fundamentals
    slug: 01-sysid-fundamentals
    title: "Fundamentals of System Identification"
    category: "Classical System Identification"
    filters: [sysid]
    slides-id: 1G5gOl_d6-LRqTyduFOVMyBi5H-cvSh_O
    summary: >-
      Introduces model-based design and the system identification workflow, from black-box and
      white-box modeling through nonparametric and ARX estimation, with bias and consistency
      analysis and a gas furnace case study.
    outline:
      - heading: "Modeling foundations"
        items:
          - "Model-based design and essential model features"
          - "Mathematical representation of dynamic systems"
          - "Black-box versus white-box modeling"
      - heading: "Identification workflow"
        items:
          - "The complete system identification workflow"
          - "Curve fitting versus system identification"
          - "Water tank and practical engineering examples"
          - "Frequency-response and nonlinear model structures"
      - heading: "Nonparametric methods"
        items:
          - "Nonparametric methods using stochastic data"
          - "Correlation analysis and frequency-response estimation"
      - heading: "Parametric estimation"
        items:
          - "Parametric ARX model estimation"
          - "Theoretical analysis of estimator bias and consistency"
      - heading: "Case study"
        items:
          - "Real gas furnace system identification case study"

  - number: 2
    id: SysID_Nonparametric
    slug: 02-sysid-nonparametric
    title: "Nonparametric System Identification"
    category: "Classical System Identification"
    filters: [sysid]
    slides-id: 1-JFBoqauVRFOjnqzmd9pT4ySZtcKb0p8
    summary: >-
      Time- and frequency-domain nonparametric methods: impulse, step and correlation-based
      estimation, empirical transfer function estimates, Welch and Bartlett spectral smoothing,
      and FRF analysis with averaging and coherence, with MATLAB code.
    outline:
      - heading: "Time-domain methods"
        items:
          - "Time-domain identification methods"
          - "Impulse-response estimation"
          - "Step-response analysis"
          - "Correlation-based estimation with white and colored inputs"
      - heading: "Frequency-domain methods"
        items:
          - "Frequency-domain identification"
          - "Frequency-response analysis"
          - "Empirical transfer function estimation and its properties"
      - heading: "Spectral estimation"
        items:
          - "Spectral estimation"
          - "Welch and Bartlett smoothing methods"
          - "Spectral comparison"
      - heading: "FRF analysis and implementation"
        items:
          - "FRF analysis using averaging and coherence"
          - "MATLAB implementations throughout the lecture"

  - number: 3
    id: NeuralNetworks_Fundamentals
    slug: 03-neural-networks-fundamentals
    title: "Fundamentals of Neural Networks"
    category: "Neural Network Fundamentals"
    filters: [nn]
    slides-id: 1I0DWXM3Ez7RYq8mOD28BRd9mV7EYwyRa
    summary: >-
      Builds neural networks up from regression and curve fitting: layers, activation functions,
      output nodes and loss functions, backpropagation with numerical examples, and training
      practice with Python code.
    outline:
      - heading: "From regression to neural networks"
        items:
          - "Regression and curve fitting as introductory AI concepts"
          - "Constructing a custom regressor"
          - "Transition from a custom regressor to neural network architecture"
          - "Bio-inspired intelligence"
      - heading: "Network components"
        items:
          - "Neural network layers"
          - "Activation functions"
          - "Output node types"
          - "Loss functions for regression and classification"
      - heading: "Backpropagation"
        items:
          - "Backpropagation"
          - "Forward pass and loss computation"
          - "Backward pass and numerical examples"
      - heading: "Training practice"
        items:
          - "Training, validation, and test datasets"
          - "Batch size versus epoch"
          - "Python implementation examples"

  - number: 4
    id: FuzzyLogic_Fundamentals
    slug: 04-fuzzy-logic-fundamentals
    title: "Fundamentals of Fuzzy Logic"
    category: "Fuzzy Logic & Fuzzy Identification"
    filters: [fuzzy]
    slides-id: 1vxg00IkNzMOgDvYTROr1zfVDCDHU0kYW
    summary: >-
      Contrasts conventional and fuzzy control, then builds a fuzzy inference system step by
      step: fuzzy sets, fuzzification, rule evaluation, min-max operators, defuzzification,
      Mamdani versus Sugeno, and a MATLAB implementation.
    outline:
      - heading: "Fuzzy concepts"
        items:
          - "Conventional versus fuzzy controllers"
          - "Classical sets versus fuzzy sets"
          - "Fuzzy membership graphs using cold, warm, and hot examples"
      - heading: "Fuzzy inference system"
        items:
          - "Construction of a fuzzy inference system"
          - "Fuzzification"
          - "Fuzzy rule evaluation"
          - "Defuzzification"
      - heading: "Operators and system types"
        items:
          - "Min-max fuzzy logic operators"
          - "Defuzzification methods"
          - "Mamdani versus Sugeno fuzzy inference systems"
      - heading: "Implementation"
        items:
          - "MATLAB Fuzzy Logic Toolbox implementation"

